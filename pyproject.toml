[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fyst-to-toast"
version = "0.1.0.dev0"
description = "Experimental FYST-to-TOAST adapter: CES baseline and trajectory HDF5 export"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSES/*.txt"]
dependencies = [
    "toast>=3.0.5,<4",
    "numpy",
    "scipy",
    "astropy",
    "traitlets",
]

[project.optional-dependencies]
# Used by fyst_to_toast.generate / scripts/generate_trajectory.py and optional FYST tests.
# 0.11.0 is the first release with UTC-offset ECSV times; no local patch is needed.
fyst = ["fyst-trajectories>=0.11,<0.12"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]

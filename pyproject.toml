[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fyst-to-toast"
version = "0.3.0"
description = "Feed FYST telescope trajectories into TOAST simulations"
readme = "README.md"
requires-python = ">=3.10"
# sim_fyst.py is adapted from TOAST (also BSD-2-Clause); its notice is in LICENSES/.
license = "BSD-2-Clause"
license-files = ["LICENSE", "LICENSES/*.txt"]
dependencies = [
    "toast>=3.0.5,<4",
    "numpy",
    "astropy",
    "traitlets",
]

[project.optional-dependencies]
# Used by fyst_to_toast.generate, the two generation scripts and optional FYST tests.
# 0.12 marks schedule boresight_angle as the TOAST roll with a convention header;
# 0.13 adds plan_constant_el_window_scan, used by generate_window_ces.
fyst = ["fyst-trajectories>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
